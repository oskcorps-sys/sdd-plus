version: 1

github_integration:
  enabled: true
  repo: "oskcorps-sys/sdd-plus"

enforcement:
  mode: strict_allowlist

roles:
  implementer:
    description: "Writes code, tests, contracts against locked specs"
    executor: "any"  # e.g. claude, gpt-4, llama, gemini, human, custom
    allowed_transitions:
      - "DRAFT->REFINED"
      - "LOCKED->IMPLEMENTING"
      - "IMPLEMENTING->AUDITING"
    allowed_file_patterns:
      - "sdd/**/*.py"
      - "sdd/web/templates/**/*"
      - "sdd/state-machine/**/*"
      - "tests/**/*"
      - "sdd/artifacts/PHASE_*_CONTRACT.yaml"
      - "sdd/artifacts/CONTRACT.yaml"
      - "sdd/artifacts/examples/**/*"
    forbidden_file_patterns:
      - "sdd/artifacts/PHASE_*_SPEC.yaml"
      - "sdd/artifacts/PHASE_*_AUDIT.yaml"
      - "sdd/handoffs/**/*"
      - "AGENTS.yaml"
    constraints:
      - "Cannot modify SPEC or AUDIT artifacts"
      - "Cannot lock or complete phases"

  auditor:
    description: "Reviews, gates transitions, writes specs and audits"
    executor: "any"  # e.g. claude, gpt-4, llama, gemini, human, custom
    allowed_transitions:
      - "DRAFT->REFINED"
      - "REFINED->LOCKED"
      - "AUDITING->COMPLETED"
      - "AUDITING->IMPLEMENTING"
      - "*->DRAFT"
    allowed_file_patterns:
      - "sdd/artifacts/PHASE_*_SPEC.yaml"
      - "sdd/artifacts/PHASE_*_AUDIT.yaml"
      - "sdd/handoffs/**/*"
      - "AGENTS.yaml"
    forbidden_file_patterns:
      - "sdd/**/*.py"
      - "sdd/web/templates/**/*"
      - "sdd/state-machine/**/*"
      - "sdd/artifacts/PHASE_*_CONTRACT.yaml"
      - "sdd/artifacts/CONTRACT.yaml"
      - "tests/**/*"
    constraints:
      - "Cannot write implementation code"
      - "Cannot skip audit step"
