[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdd-plus"
version = "0.4.0"
description = "Specification-Driven Development Extended - LLM-agnostic spec-first governance framework with role enforcement, telemetry, and GitHub integration"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Oscar Franco", email = "oscar@regusense.com"},
]
keywords = ["sdd", "spec-driven", "ai-agents", "orchestration", "development-framework", "llm-agnostic", "github"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-yaml>=0.11.0",
    "typer[all]>=0.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pytest-watch>=4.2.0",
    "httpx>=0.27.0",
    "bandit>=1.7.0",
    "radon>=6.0.0",
    "pip-audit>=2.7.0",
    "build>=1.0.0",
]

[project.scripts]
sdd = "sdd.cli.main:app"

[project.urls]
Homepage = "https://github.com/oskcorps-sys/sdd-plus"
Repository = "https://github.com/oskcorps-sys/sdd-plus"
Issues = "https://github.com/oskcorps-sys/sdd-plus/issues"
Changelog = "https://github.com/oskcorps-sys/sdd-plus/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["sdd"]

[tool.uv]
python = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests", "sdd"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=sdd --cov-report=html --cov-report=term-missing"
minversion = "7.0"

[tool.coverage.run]
source = ["sdd"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # line-length handled by black

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
