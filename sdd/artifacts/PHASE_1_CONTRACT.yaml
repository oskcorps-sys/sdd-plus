phase: 1
contract_id: contract-rakso-phase-1-v1
created_at: 2026-06-04T15:25:00Z
status: DRAFT

specification:
  title: "RAKSO Fortress OS — MVP Core"
  description: |
    Implement the core agent architecture and adapter layer for RAKSO Fortress OS.
    This includes:
    1. HermesOZ Master Orchestrator, MarketingAgent Domain Coordinator, and the sub-agents (RAKSOCreativo, NeurofunnelSub, ModuleC, TheBridge).
    2. Obsidian vault Identity Pack reader & validator.
    3. LLM and Channel Adapter layers (Anthropic, OpenAI, Google, Telegram, Instagram, TikTok, YouTube).
    4. Gated execution pipelines with MANUAL, SEMI-AUTO, and AUTO operation modes.
    5. Parallel agent invocation and Telegram interactive interface mocks.
  success_criteria:
    - "MarketingAgent processes a brief and gets a Bridge verdict"
    - "Parallel execution of creativo, neurofunnel, and modulec is verified"
    - "Obsidian Identity Pack loads automatically and passes schema check"
    - "The Bridge blocks/vetoes policy violations (e.g. manipulative copy)"
    - "MANUAL, SEMI-AUTO, and AUTO modes work via mock Telegram handler"
    - "Test coverage of RAKSO code >= 85%"
    - "Swapping a model in adapter config does not require changing core logic"

inputs:
  brief:
    type: "dict"
    required: true
    description: "Brief with campaign objective and targets"
    example:
      objective: "Promote new software development framework"
      target_channel: "Telegram"
      audience: "Developers"

outputs:
  publication_payload:
    type: "dict"
    description: "Approved copy, funnel stage mapping, and compliance scoring"
    example:
      copy: "Check out this clean implementation..."
      stage_metadata:
        funnel_stage: "AWARENESS"
        core_emotion: "curiosity"
        cognitive_bias: "Curiosity gap"
      bridge_verdict: "APPROVED"

constraints:
  - "The Bridge has absolute veto authority (no output ships without Bridge approval)"
  - "Zero copy mutations allowed at publication-time (Trafficker can't modify approved text)"
  - "No manipulative framing, false urgency, or identity destruction in RAKSO outputs"
  - "Parallel sub-agent fan-out must execute concurrently (using asyncio or ThreadPoolExecutor)"
  - "Adapter-based model layer (LLM providers are hot-swappable)"
  - "Obsidian vault parser must read local files (markdown and YAML frontmatter) representing Obsidian storage"

acceptance_tests:
  - name: "test_identity_pack_load_valid"
    given: "Valid mock Obsidian vault directory"
    when: "load_identity_pack called"
    then: "Successfully loads all voice, visual, product, and limit attributes"

  - name: "test_marketing_agent_orchestration_happy_path"
    given: "Valid brief and loaded Identity Pack"
    when: "MarketingAgent orchestrates execution"
    then: "Parallel sub-agents execute, Bridge approves, and final output is returned"

  - name: "test_bridge_veto_manipulative_copy"
    given: "Brief prompting for false urgency copy"
    when: "Pipeline executes under AUTO/SEMI-AUTO mode"
    then: "The Bridge blocks the copy with BLOCKED status and detailed veto reasons"

  - name: "test_model_adapter_swappability"
    given: "Model configuration setting OpenAI for Creativo"
    when: "Swapped to Anthropic via config"
    then: "Creativo runs successfully without any change to its class implementation"

  - name: "test_operation_modes_routing"
    given: "Pipeline configured for MANUAL or SEMI-AUTO mode"
    when: "MarketingAgent routes the output to the Bridge"
    then: "Pipeline pauses to await mock Telegram confirmation"

  - name: "test_coverage_threshold"
    given: "Full RAKSO MVP code"
    when: "pytest run on tests/rakso/"
    then: "Coverage >= 85%"

committed_by: "antigravity"
human_approved: false

references:
  - phase_spec: "sdd/artifacts/PHASE_1_SPEC.yaml"
